<style>
/* Correções de estabilidade visual — preserva o design original */
html{scroll-behavior:smooth}
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,textarea,select{font:inherit}
button{-webkit-tap-highlight-color:transparent}
input,textarea,select{-webkit-appearance:none;appearance:none}
img,svg{max-width:100%}
svg{display:block;flex:none}
.modal-overlay{overscroll-behavior:contain}
.modal{max-height:calc(100dvh - 32px);overflow-y:auto;-webkit-overflow-scrolling:touch}
@supports not (height:100dvh){
  .modal{max-height:calc(100vh - 32px)}
}
@media (max-width:700px){
  .app{padding-bottom:80px}
  .modal-overlay{padding:14.16px}
  .modal{width:100%;max-height:calc(100dvh - 24px)}
}
@media (max-width:380px){
  .modal-overlay{padding:9.44px}
  .modal{max-height:calc(100dvh - 18.4px)}
}
</style>

<style>
/* RESPONSIVIDADE MOBILE — NÃO ALTERA O DESKTOP */
@media (max-width: 560px) {
  /* Evita qualquer rolagem horizontal no celular */
  html, body {
    width: 100%;
    overflow-x: hidden;
  }

  /* Conteúdo principal */
  .main {
    width: 100%;
    box-sizing: border-box;
  }

  .hero {
    width: 100%;
    box-sizing: border-box;
  }

  .hero h1 {
    line-height: 1.15;
  }

  /* Busca */
  .hero-search {
    width: 100%;
    box-sizing: border-box;
  }

  .hero-search input,
  .hero-search .searchtext {
    min-width: 0;
    width: 100%;
    box-sizing: border-box;
  }

  /* Cards e grids */
  .quick-grid,
  .grid2,
  .grid3,
  .categories,
  .method-grid,
  .how-grid {
    width: 100%;
    box-sizing: border-box;
  }

  .quick,
  .card,
  .cat-card,
  .method,
  .how-item,
  .follow-step {
    min-width: 0;
    box-sizing: border-box;
  }

  .card-footer {
    gap: 10px;
  }

  .copybtn {
    min-height: 42px;
  }

  /* Modal de personalização */
  .modal {
    box-sizing: border-box;
    width: 100%;
  }

  .modal-head,
  .modal-body {
    box-sizing: border-box;
  }

  .message-box {
    box-sizing: border-box;
    width: 100%;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  .fields,
  .form-grid,
  .form-grid.three {
    width: 100%;
    box-sizing: border-box;
  }

  .field,
  .form-field {
    min-width: 0;
  }

  .field input,
  .field textarea,
  .form-field input,
  .form-field textarea {
    box-sizing: border-box;
    width: 100%;
    font-size: 16px;
  }

  .modal-actions {
    width: 100%;
    box-sizing: border-box;
  }

  .modal-actions .primary,
  .modal-actions .secondary {
    min-height: 44px;
  }
}

@media (max-width: 380px) {
  .main {
    padding-left: 10px;
    padding-right: 10px;
  }

  .hero {
    padding: 16px;

function searchView(){const cats=[...new Set(respostas.map(s=>s.categoria))];const q=normalize(state.search);const list=respostas.filter(item=>{if(state.searchCat&&item.categoria!==state.searchCat)return false;if(!q)return true;const fields=[item.titulo,item.situacao,item.objetivo,item.resposta,item.variacao,item.categoria,...(item.keywords||[])].map(normalize);let syn=false;if(q==='caro'||q==='esta caro')syn=normalize(item.keywords.join(' ')).includes('desconto')||[28,43,44].includes(item.id);else if(q==='sumiu'||q==='sumir')syn=item.categoria==='Cliente sumiu'||[57,81].includes(item.id);else if(q==='horario'||q==='sabado'||q==='vaga')syn=item.categoria==='Cliente quente'||item.categoria==='Agendamento';return fields.some(x=>x.includes(q))||syn});const sugg=['Quanto custa','Está caro','Cliente sumiu','Tem horário','Sábado','Desconto','Cancelar','Atrasada','Pix','Vou pensar','Cliente antiga'];return `<div class="space6"><div class="searchbox"><div class="search-input-wrap"><span style="position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#a8a29e;font-size:22px">⌕</span><input id="main-search" class="search-input" value="${esc(state.search)}" placeholder="O que a cliente disse? (ex: caro, quanto custa, sumiu, sábado, cancelar...)"><button class="clear" data-clear-search>${state.search?'×':''}</button></div><div class="suggestions"><span class="section-sub" style="padding:7px 2px">Sugestões:</span>${sugg.map(x=>`<button class="chip" data-suggest="${esc(x)}">${x}</button>`).join('')}</div></div><div><div class="section-head" style="margin-bottom:8px"><span class="section-sub">⚑ Filtrar por categoria:</span>${state.searchCat?'<button class="section-link" data-clear-cat>Limpar filtro</button>':''}</div><div class="filter-row"><button class="filter-chip ${!state.searchCat?'active':''}" data-filter-cat="">Todas (${respostas.length})</button>${cats.map(c=>`<button class="filter-chip ${state.searchCat===c?'active':''}" data-filter-cat="${esc(c)}">${esc(c)} <s function categoriesView(){if(state.searchCat){const list=respostas.filter(s=>s.categoria===state.searchCat),m=categoriasMetadados[state.searchCat]||{};return `<div class="space6"><div class="card"><button class="backbtn" data-clear-cat>← Voltar para todas as categorias</button><div class="recovery-head" style="margin-top:10px"><div class="cat-icon">${icon(m.icone||'FolderOpen')}</div><div><div style="display:flex;gap:8px;align-items:center"><h2 style="font-size:22px">${esc(state.searchCat)}</h2><span class="count">${list.length} situações</span></div><div class="section-sub">${esc(m.descricao||'')}</div></div></div></div><div class="grid2">${list.map(card).join('')}</div></div>`}return `<div class="space6"><div><div class="section-title" style="font-size:22px">Categorias de Atendimento</div><div class="section-sub">Navegue pelas 11 etapas da conversa com a cliente, do primeiro 'oi' até a fidelização</div></div><div class="categories">${Object.keys(categoriasMetadados).map(c=>{const m=categoriasMetadados[c],n=respostas.filter(s=>s.categoria===c).length;return `<div class="card cat-card" data-category="${esc(c)}"><div><div class="cat-top"><div class="cat-icon">${icon(m.icone||'FolderOpen')}</div><span class="count">${n} ${n===1?'situação':'situações'}</span></div><h3>${esc(c)}</h3><p>${esc(m.descricao||'')}</p></div><div class="cat-bottom">Explorar situações <span>→</span></div></div>`}).join('')}</div></div>`}

function welcomeModal(){if(!state.welcome)return '';return `<div class="overlay"><div class="modal" style="max-width:440px;text-align:center"><div class="modal-body" style="padding:28px 24px"><div class="brand-icon" style="margin:auto;width:56px;height:56px;font-size:26px">${icon('MessageCircle')}</div><div style="margin-top:14px"><div class="modal-cat">SEJA MUITO BEM-VINDA</div><div class="modal-title" style="font-size:25px">Agenda Cheia no WhatsApp</div><div class="section-sub" style="margin-top:5px">Sua cliente perguntou. Você sabe exatamente o que responder em segundos.</div></div><div class="card" style="text-align:left;margin-top:16px">${['Procure o que ela disse na busca rápida.','Escolha a situação mais parecida.','Personalize os dados (ou use o auto-preenchimento).','Copie com 1 clique.','Cole e envie no WhatsApp!'].map((x,i)=>`<div style="display:flex;gap:9px;align-items:flex-start;font-size:11px;margin:${i?'10px 0 0':'0'}"><span class="step-num" style="background:#ffe4e6;color:#be123c">${i+1}</span><span>${x}</span></div>`).join('')}</div><button class="primary" data-close-welcome style="width:100%;margin-top:16px">COMEÇAR A USAR →</button><div class="section-sub" style="margin-top:10px">127 situações prontas • Sem mensalidades ocultas</div></div></div></div>`}
function render(){applyTheme();$('root').innerHTML=`<div class="app">${header()}<main class="main">${mainContent()}</main><footer class="footer"><strong>AGENDA CHEIA NO WHATSAPP • 127 situações reais</strong>Desenvolvido para Nail Designers e Manicures autônomas transformarem conversas em horários marcados.</footer>${bottomNav()}${detailModal()}${businessModal()}${welcomeModal()}</div>`;bind();}
function bind(){document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>{state.tab=el.dataset.tab; if(state.tab!=='categorias')state.searchCat=null; window.scrollTo(0,0);render()});document.querySelectorAll('[data-business]').forEach(el=>el.onclick=()=>{state.businessModal=true;render()});document.querySelectorAll('[data-theme]').forEach(el=>el.onclick=()=>{state.dark=!state.dark;saveAll();render()});document.querySelectorAll('[data-open]').forEach(el=>el.onclick=e=>{e.stopPropagation();openSituacao(Number(el.dataset.open))});document.querySelectorAll('[data-fav]').forEach(el=>el.onclick=e=>toggleFav(Number(el.dataset.fav),e));document.querySelectorAll('[data-copy]').forEach(el=>el.onclick=e=>{e.stopPropagation();const s=respostas.find(x=>x.id===Number(el.dataset.copy));if(s)copyText(s.resposta).then(()=>toast('Copiado!'))});document.querySelectorAll('[data-suggest]').forEach(el=>el.onclick=()=>{state.search=el.dataset.suggest;state.tab='buscar';render()});document.querySelectorAll('[data-filter-cat]').forEach(el=>el.onclick=()=>{state.searchCat=el.dataset.filterCat||null;render()});document.querySelectorAll('[data-clear-cat]').forEach(el=>el.onclick=()=>{state.searchCat=null;render()});document.querySelectorAll('[data-clear-search]').forEach(el=>el.onclick=()=>{state.search='';render()});document.querySelectorAll('[data-reset-search]').forEach(el=>el.onclick=()=>{state.search='';state.searchCat=null;render()});document.querySelectorAll('[data-category]').forEach(el=>el.onclick=()=>{state.tab='categorias';state.searchCat=el.dataset.category;render()});document.querySelectorAll('[data-rule]').forEach(el=>el.onclick=()=>{state.ruleFilter=el.dataset.rule;render()});const inp=$('main-search');if(inp){inp.oninput=()=>{state.search=inp.value;render();const x=$('main-search');if(x){x.focus();x.setSelectionRange(x.value.length,x.value.length)}}}document.querySelectorAll('[data-close-situacao]').forEach(el=>el.onclick=()=>{state.selected=null;render()});document.querySelectorAll('[data-close-modal]').forEach(el=>el.onclick=()=>{state.selected=null;render()});document.querySelectorAll('[data-msg-tab]').forEach(el=>el.onclick=()=>{state.messageTab=el.dataset.msgTab;state.manual=false;render()});const msgCopy=document.querySelector('[data-copy-message]');if(msgCopy)msgCopy.onclick=()=>{const text=state.manual?state.editable:replacePlaceholders(state.messageTab==='principal'?state.selected.resposta:state.selected.variacao);copyText(text).then(()=>toast('Resposta copiada!'))};const wa=document.querySelector('[data-whatsapp]');if(wa)wa.onclick=()=>{const text=state.manual?state.editable:replacePlaceholders(state.messageTab==='principal'?state.selected.resposta:state.selected.variacao);window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(text),'_blank','noopener')};const manual=document.querySelector('[data-manual]');if(manual)manual.onclick=()=>{state.manual=!state.manual;if(state.manual)state.editable=replacePlaceholders(state.messageTab==='principal'?state.selected.resposta:state.selected.variacao);render()};const edit=$('editable');if(edit)edit.oninput=()=>state.editable=edit.value;document.querySelectorAll('[data-custom]').forEach(el=>el.oninput=()=>{
  state.custom[el.dataset.custom]=el.value;
  state.manual=false;
  const currentTemplate=state.messageTab==='principal'?state.selected.resposta:state.selected.variacao;
  const box=document.querySelector('.message-box');
  if(box) box.textContent=replacePlaceholders(currentTemplate);
});const favm=document.querySelector('[data-fav-modal]');if(favm)favm.onclick=()=>toggleFav(state.selected.id);document.querySelectorAll('[data-close-business]').forEach(el=>el.onclick=()=>{state.businessModal=false;render()});const bf=$('business-form');if(bf)bf.onsubmit=e=>{e.preventDefault();const fd=new FormData(bf);Object.keys(DEFAULT_PROFILE).forEach(k=>state.profile[k]=fd.get(k)||'');state.businessModal=false;saveAll();render();toast('Dados salvos!')};document.querySelectorAll('[data-close-welcome]').forEach(el=>el.onclick=()=>{state.welcome=false;localStorage.setItem('agenda_cheia_welcomed','true');render()});document.querySelectorAll('[data-light]').forEach(el=>el.onclick=()=>{state.dark=false;saveAll();render()});document.querySelectorAll('[data-dark]').forEach(el=>el.onclick=()=>{state.dark=true;saveAll();render()})}
applyTheme();render();
})();
</script>
</body></html>
